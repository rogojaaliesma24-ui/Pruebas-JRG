<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Actividades Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .contenedor-principal {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .imagen-perfil {
            width: 150px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .contenido-lista {
            flex: 1;
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .actividad-card {
            background: white;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: #3498db;
            font-size: 1.2rem;
        }

        ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        li {
            margin: 8px 0;
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
            padding: 6px 12px;
            background-color: #eef2f5;
            border-radius: 4px;
            transition: 0.2s;
        }

        a:hover {
            background-color: #3498db;
            color: white;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <img src="Avatar" alt="Avatar" class="imagen-perfil">

        <div class="contenido-lista">
            <h1>Mis Actividades</h1>

            <div class="actividad-card">
                <h2>Actividad 1</h2>
                <ul>
                    <li><a href="actividad1/ejercicio1.html">Ejercicio 1</a></li>
                    <li><a href="actividad1/ejercicio2.html">Ejercicio 2</a></li>
                    <li><a href="actividad1/ejercicio3.html">Ejercicio 3</a></li>
                </ul>
            </div>

            <div class="actividad-card">
                <h2>Actividad 2</h2>
                <ul>
                    <li><a href="actividad2/actividad2.html">Actividad 2 principal</a></li>
                    <li><a href="actividad2/tabla.html">Tabla</a></li>
                </ul>
            </div>

            <div class="actividad-card">
                <h2>Actividad 3</h2>
                <ul>
                    <li><a href="actividad3/formularios.html">Formularios</a></li>
                </ul>
            </div>

            <div class="actividad-card">
                <h2>Actividad 4</h2>
                <ul>
                    <li><a href="actividad4/noticias_texto.html">Noticias Texto</a></li>
                </ul>
            </div>
        </div>
    </div>

</body>
</html>
